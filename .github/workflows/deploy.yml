name: Deploy (via Jump Server)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      use_custom_jump_port:
        description: 'Jump server uses custom port?'
        required: true
        type: boolean
        default: false

env:
  DEPLOY_PATH: /opt/intel-ai
  DOCKER_COMPOSE_FILE: docker-compose.yml

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH (with custom jump port)
        if: ${{ inputs.use_custom_jump_port }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          cat > ~/.ssh/config << EOF
          Host jump
            HostName ${{ secrets.JUMP_HOST }}
            Port ${{ secrets.JUMP_PORT }}
            User ${{ secrets.JUMP_USER }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host target
            HostName ${{ secrets.TARGET_HOST }}
            User ${{ secrets.TARGET_USER }}
            ProxyJump jump
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          
          chmod 600 ~/.ssh/config

      - name: Configure SSH (default jump port)
        if: ${{ !inputs.use_custom_jump_port }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          cat > ~/.ssh/config << EOF
          Host jump
            HostName ${{ secrets.JUMP_HOST }}
            User ${{ secrets.JUMP_USER }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host target
            HostName ${{ secrets.TARGET_HOST }}
            User ${{ secrets.TARGET_USER }}
            ProxyJump jump
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          
          chmod 600 ~/.ssh/config

      - name: Create deployment package
        run: |
          tar -czvf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='*.pyc' \
            .

      - name: Copy files to target server
        env:
          JUMP_PASS: ${{ secrets.JUMP_PASSWORD }}
          TARGET_PASS: ${{ secrets.TARGET_PASSWORD }}
        run: |
          # Use expect script for multi-hop password auth
          cat > /tmp/scp_deploy.exp << 'EXPECT_SCRIPT'
          #!/usr/bin/expect -f
          set timeout 300
          set jump_pass [lindex $argv 0]
          set target_pass [lindex $argv 1]
          set local_file [lindex $argv 2]
          set remote_path [lindex $argv 3]
          
          spawn scp -o StrictHostKeyChecking=no $local_file target:$remote_path
          
          expect {
            "*jump*password:" {
              send "$jump_pass\r"
              exp_continue
            }
            "*target*password:" {
              send "$target_pass\r"
              exp_continue
            }
            "*password:" {
              send "$jump_pass\r"
              exp_continue
            }
            eof
          }
          EXPECT_SCRIPT
          
          chmod +x /tmp/scp_deploy.exp
          sudo apt-get install -y expect
          /tmp/scp_deploy.exp "$JUMP_PASS" "$TARGET_PASS" "deploy.tar.gz" "/tmp/deploy.tar.gz"

      - name: Deploy on target server
        env:
          JUMP_PASS: ${{ secrets.JUMP_PASSWORD }}
          TARGET_PASS: ${{ secrets.TARGET_PASSWORD }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: |
          cat > /tmp/ssh_deploy.exp << 'EXPECT_SCRIPT'
          #!/usr/bin/expect -f
          set timeout 600
          set jump_pass [lindex $argv 0]
          set target_pass [lindex $argv 1]
          set deploy_path [lindex $argv 2]
          
          spawn ssh target
          
          expect {
            "*jump*password:" {
              send "$jump_pass\r"
              exp_continue
            }
            "*target*password:" {
              send "$target_pass\r"
              exp_continue
            }
            "*password:" {
              send "$jump_pass\r"
              exp_continue
            }
            "*$ " {
              # Connected, run deployment commands
            }
          }
          
          send "set -e\r"
          expect "$ "
          
          send "sudo mkdir -p $deploy_path\r"
          expect {
            "*password*" {
              send "$target_pass\r"
              exp_continue
            }
            "$ "
          }
          
          send "sudo tar -xzf /tmp/deploy.tar.gz -C $deploy_path\r"
          expect "$ "
          
          send "cd $deploy_path && sudo docker compose pull && sudo docker compose up -d --build\r"
          expect {
            "*password*" {
              send "$target_pass\r"
              exp_continue
            }
            "$ " {
              # Wait for completion
            }
            timeout {
              puts "Deployment timeout"
              exit 1
            }
          }
          
          send "sudo docker compose ps\r"
          expect "$ "
          
          send "rm /tmp/deploy.tar.gz\r"
          expect "$ "
          
          send "exit\r"
          expect eof
          EXPECT_SCRIPT
          
          chmod +x /tmp/ssh_deploy.exp
          /tmp/ssh_deploy.exp "$JUMP_PASS" "$TARGET_PASS" "$DEPLOY_PATH"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ secrets.TARGET_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Path:** ${{ env.DEPLOY_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
