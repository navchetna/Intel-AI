name: Deploy (via Jump Server)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      use_custom_jump_port:
        description: 'Jump server uses custom port?'
        required: true
        type: boolean
        default: false
      test_only:
        description: 'Test connectivity only (no deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_PATH: /home/ritik-intel/Intel-AI
  DOCKER_COMPOSE_FILE: docker-compose.yml

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass expect

      - name: Setup SSH config (with custom jump port)
        if: ${{ inputs.use_custom_jump_port }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config << EOF
          Host jump
            HostName ${{ secrets.JUMP_HOST }}
            Port ${{ secrets.JUMP_PORT }}
            User ${{ secrets.JUMP_USER }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host target
            HostName ${{ secrets.TARGET_HOST }}
            User ${{ secrets.TARGET_USER }}
            ProxyJump jump
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Setup SSH config (default port 22)
        if: ${{ !inputs.use_custom_jump_port }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config << EOF
          Host jump
            HostName ${{ secrets.JUMP_HOST }}
            User ${{ secrets.JUMP_USER }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host target
            HostName ${{ secrets.TARGET_HOST }}
            User ${{ secrets.TARGET_USER }}
            ProxyJump jump
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Test connectivity
        run: |
          cat > /tmp/test_conn.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 60
          set jump_pass $env(JUMP_PASS)
          set target_pass $env(TARGET_PASS)
          
          spawn ssh target "echo 'Connection successful!' && hostname && whoami"
          
          expect {
            -re "password:" {
              send "$jump_pass\r"
              exp_continue
            }
            -re "Password:" {
              send "$target_pass\r"
              exp_continue
            }
            "Connection successful!" {
              puts "\n✅ SSH connection test passed!"
            }
            timeout {
              puts "\n❌ Connection timeout"
              exit 1
            }
            eof
          }
          EOF
          chmod +x /tmp/test_conn.exp
          
          export JUMP_PASS='${{ secrets.JUMP_PASSWORD }}'
          export TARGET_PASS='${{ secrets.TARGET_PASSWORD }}'
          /tmp/test_conn.exp

      - name: Create deployment package
        if: ${{ !inputs.test_only }}
        run: |
          tar -czvf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='*.pyc' \
            .
          ls -lh deploy.tar.gz

      - name: Copy and deploy
        if: ${{ !inputs.test_only }}
        run: |
          cat > /tmp/deploy.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 600
          set jump_pass $env(JUMP_PASS)
          set target_pass $env(TARGET_PASS)
          set deploy_path $env(DEPLOY_PATH)
          
          # Copy file
          puts "📦 Copying deployment package..."
          spawn scp deploy.tar.gz target:/tmp/deploy.tar.gz
          expect {
            -re "password:" {
              send "$jump_pass\r"
              exp_continue
            }
            -re "Password:" {
              send "$target_pass\r"
              exp_continue
            }
            "100%" {
              puts "✅ File copied"
            }
            timeout {
              puts "❌ SCP timeout"
              exit 1
            }
            eof
          }
          
          # Deploy
          puts "🚀 Deploying..."
          spawn ssh target
          expect {
            -re "password:" {
              send "$jump_pass\r"
              exp_continue
            }
            -re "Password:" {
              send "$target_pass\r"
              exp_continue
            }
            -re {\$ $} {
              # Got shell prompt
            }
            timeout {
              puts "❌ SSH timeout"
              exit 1
            }
          }
          
          send "mkdir -p $deploy_path && tar -xzf /tmp/deploy.tar.gz -C $deploy_path && cd $deploy_path && docker compose up -d --build && docker compose ps\r"
          expect {
            -re {\$ $} {
              puts "✅ Deployment complete"
            }
            timeout {
              puts "❌ Deploy command timeout"
              exit 1
            }
          }
          
          send "rm /tmp/deploy.tar.gz && exit\r"
          expect eof
          EOF
          chmod +x /tmp/deploy.exp
          
          export JUMP_PASS='${{ secrets.JUMP_PASSWORD }}'
          export TARGET_PASS='${{ secrets.TARGET_PASSWORD }}'
          export DEPLOY_PATH='${{ env.DEPLOY_PATH }}'
          /tmp/deploy.exp

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.test_only }}" = "true" ]; then
            echo "🔍 **Test only** - no deployment performed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Deployed successfully**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Target:** ${{ secrets.TARGET_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Path:** ${{ env.DEPLOY_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
