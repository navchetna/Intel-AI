name: CI

# Manually triggered only. Run from the Actions tab → "CI" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or PR ref to test"
        required: false
        default: ""

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify Signed-off-by on new commits
        run: |
          base="${{ github.event.repository.default_branch }}"
          range="origin/${base}..HEAD"
          if ! git rev-parse --verify -q "origin/${base}" >/dev/null; then
            range="HEAD~20..HEAD"
          fi
          missing=0
          for sha in $(git rev-list "$range"); do
            if ! git log -1 --format='%b' "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "✖ Commit $sha is missing Signed-off-by (use git commit -s)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All commits are signed off."

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint + typecheck
        run: npm run lint && npm run typecheck
      - name: Build
        run: npm run build
