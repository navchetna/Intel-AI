services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelai}
      POSTGRES_DB: ${POSTGRES_DB:-intelai}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-intelai}:${POSTGRES_PASSWORD:-intelai}@db:5432/${POSTGRES_DB:-intelai}
    ports:
      - "${BACKEND_PORT:-8004}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
