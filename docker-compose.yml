services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelai}
      POSTGRES_DB: ${POSTGRES_DB:-intelai}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-intelai}:${POSTGRES_PASSWORD:-intelai}@db:5432/${POSTGRES_DB:-intelai}
      CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-3010},http://localhost:3010,http://localhost:3000"
    ports:
      - "${BACKEND_PORT:-8015}:8000"
    depends_on:
      db:
        condition: service_healthy

  intel-bluelens:
    # Built from GitHub repo. Vite `base` is set to `/intel-ai/intel-bluelens/`
    # (nginx strips `/intel-ai` and the frontend rewrites `/intel-bluelens/*` here).
    build:
      context: https://github.com/navchetna/Intel-BlueLens.git
    expose:
      - "3003"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        ASSET_PREFIX: ""
        NEXT_PUBLIC_BASE_PATH: ""
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8015}
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    depends_on:
      - backend
      - intel-bluelens

volumes:
  pgdata:
